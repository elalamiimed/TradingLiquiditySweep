[pytest]
minversion = 7.0
testpaths = tests
pythonpath = .

# ── Coverage settings ──
addopts =
    --strict-markers
    --disable-warnings
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80

# ── Markers ──
markers =
    unit: Unit tests (fast, no deps)
    integration: Integration tests (mock OHLCV pipeline)
    smoke: Backtest smoke tests (7-day run)
